<!DOCTYPE html><html lang="en-GB"><head>
<script src="shim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Christmas Supper with the Warren Family">
<meta property="og:description" content="Instead of presents this year, come and share a Christmas meal with us — pick your evening here.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>"><base target="_top"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;font-family:Lato,sans-serif;color:#2a2320;background:linear-gradient(180deg,#1b3a28,#10261a)}.wrap{max-width:540px;margin:0 auto;padding:36px 16px}h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:56px;color:#fbf6ec;text-align:center;margin:0 0 20px}.card{background:#fbf6ec;border:2px solid #c9a44c;border-radius:18px;padding:24px 22px}.big{font-size:48px;text-align:center}p{font-family:"Cormorant Garamond",serif;font-size:20px;line-height:1.5;text-align:center;margin:10px 0}.sub{font-family:Lato,sans-serif;font-size:15px;color:#6d5f55}textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1.5px solid #d8c9a6;margin:10px 0 14px}button{display:block;width:100%;border:0;border-radius:999px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:#8e1b2c;color:#fbf6ec}button:disabled{opacity:.6}.err{background:#fdecee;color:#8e1b2c;border:1px solid #f0c2c8;border-radius:10px;padding:12px;margin-top:12px;font-size:15px}.hidden{display:none}</style></head><body><div class="wrap"><h1>Approve</h1><div class="card"><div class="big" id="icon">⏳</div><p id="msg">One moment…</p><p class="sub" id="sub"></p><div id="declineBox" class="hidden"><textarea id="note" placeholder="Add a personal note if you like, e.g. “We’ve got the builders in — let’s find somewhere nice nearby instead!”"></textarea><button id="declineBtn" type="button">Send polite note</button></div><div id="err" class="err hidden"></div></div></div><script>var id="", key="", action="approve";var qs=new URLSearchParams(location.search);if(!id){id=qs.get("approve")||"";} if(!key){key=qs.get("key")||"";} if(qs.get("do")==="decline"){action="decline";}document.querySelector("h1").textContent=action==="decline"?"Decline politely":"Approve";function $(i){return document.getElementById(i);}function show(icon,msg,sub){$("icon").textContent=icon;$("msg").textContent=msg;$("sub").textContent=sub||"";}function fail(e){$("err").textContent=((e&&e.message)||String(e)).replace(/^(Exception|Error):\s*/,"");$("err").classList.remove("hidden");$("icon").textContent="⚠️";}google.script.run.withFailureHandler(fail).withSuccessHandler(function(b){if(b.cancelled){show("🕯️",b.name+" cancelled this booking on "+b.cancelled+".","Nothing to do.");return;}if(b.declined&&!b.involvesHome){show("📨","You declined this on "+b.declined+".",b.name+" has had your note.");return;}if(action==="decline"){if(b.approved){show("✅","You already approved this on "+b.approved+".","If plans have changed, reply to "+b.name+" directly.");return;}show("💬",b.ask+" on "+b.date+".","They’ll get a kind note saying you can’t this time. Their evening stays booked with you.");$("declineBox").classList.remove("hidden");$("declineBtn").onclick=function(){var btn=$("declineBtn");btn.disabled=true;btn.textContent="Sending…";google.script.run.withFailureHandler(function(e){fail(e);btn.disabled=false;btn.textContent="Send polite note";}).withSuccessHandler(function(r){$("declineBox").classList.add("hidden");show("📨","Done — "+r.name+" has been sent a kind note.",r.venue ? "Their booking at "+r.venue+" on "+r.date+" is unchanged — just no stay over." : "Their evening on "+r.date+" is still booked, as “let’s decide together”.");}).declineHome(id,key,$("note").value);};return;}show("⏳","Approving…",b.ask+" on "+b.date+".");google.script.run.withFailureHandler(fail).withSuccessHandler(function(r){if(r.already){show("✅","Already approved on "+r.approved+".",r.name+" has had their confirmation with our address.");return;}show("🎉","Approved! "+r.name+" is confirmed for "+r.date+".","They’ve been emailed at "+r.email+" with our address and directions. You can close this page.");}).approveHome(id,key);}).getBookingForApproval(id,key);</script></body></html>
